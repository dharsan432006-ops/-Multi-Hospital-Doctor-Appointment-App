replicaCount: 2

api:
  image:
    repository: ghcr.io/example/bangalore-hospital-appointments-api
    tag: latest
    pullPolicy: IfNotPresent
  port: 4000
  env:
    TZ: Asia/Kolkata
    CORS_ORIGINS: https://appointments.example.in
  existingSecret: hospital-api-secrets # keys: DATABASE_URL, JWT_ACCESS_SECRET, JWT_REFRESH_SECRET, ENCRYPTION_KEY, REDIS_URL

web:
  image:
    repository: ghcr.io/example/bangalore-hospital-appointments-web
    tag: latest
    pullPolicy: IfNotPresent
  port: 80

ingress:
  enabled: true
  className: nginx
  apiHost: api.example.in
  webHost: appointments.example.in
  tlsSecret: hospital-tls

resources:
  api:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: 1000m, memory: 1Gi }

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
