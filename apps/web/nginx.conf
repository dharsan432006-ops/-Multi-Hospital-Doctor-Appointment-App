# Upstream API for same-origin /api/* proxy (docker-compose service `api:4000`).
# NOTE: `upstream` must live outside `server` (this file is included in `http`).
upstream api_backend {
  server api:4000;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Security headers
  # NOTE: production must NOT depend on http://localhost:4000. The web build
  # bakes VITE_API_URL at build time (--build-arg VITE_API_URL=https://api.<prod>/api).
  # CSP therefore allows same-origin + https: API endpoints only.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https:;" always;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
  gzip_min_length 1024;

  # Cache hashed Vite assets aggressively; never cache index.html
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # Same-origin API reverse proxy. MUST come before `location /` so that
  # /api/* is proxied to the API container instead of falling through to
  # the SPA fallback (which would return index.html with 200 and break
  # JSON parsing -> "Server returned a non-JSON response" on /hospitals).
  # Browser -> https://host/api/hospitals -> nginx -> http://api:4000/api/hospitals
  # NOTE: proxy_pass has NO trailing slash, so the full original URI
  # (including the /api prefix the Express server expects via
  # app.use('/api/hospitals', ...)) is preserved. Do NOT write
  # `proxy_pass http://api_backend/;` — that would strip /api and 404.
  location /api/ {
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
  }

  # Bare /api (no trailing slash): proxy to the API as well so it returns
  # the API's JSON 404 instead of an nginx 301 HTML page. fetch() follows
  # redirects, but the extra hop hides the real endpoint in diagnostics.
  location = /api {
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
