name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options: [staging, production]

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  NODE_VERSION: "20"

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Image tag
        id: meta
        run: echo "tag=main-${GITHUB_SHA::12}-$(date +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}-api:${{ steps.meta.outputs.tag }},ghcr.io/${{ github.repository }}-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build + push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}-web:${{ steps.meta.outputs.tag }},ghcr.io/${{ github.repository }}-web:latest
          # VITE_* is baked at build time. PROD_API_URL must be the bare API
          # origin WITHOUT a trailing slash or /api suffix (e.g.
          # https://api.example.in) — smoke tests use it as
          # $BASE/health and $BASE/api/health. The frontend needs the /api
          # prefix appended (frontend calls $BASE/api/hospitals).
          # NOTE: this single image bakes the PROD API origin; staging
          # frontends must build a separate image with STAGING_API_URL, or
          # serve the web via same-origin nginx /api proxy with VITE_API_URL=/api.
          build-args: VITE_API_URL=${{ secrets.PROD_API_URL }}/api
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrate-staging:
    runs-on: ubuntu-latest
    needs: build-push
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Prisma migrate deploy (staging)
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma

  deploy-staging:
    runs-on: ubuntu-latest
    needs: [build-push, migrate-staging]
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy to ECS staging (Terraform-managed service)
        run: |
          aws ecs update-service \
            --cluster hosp-staging \
            --service hosp-staging-api \
            --force-new-deployment \
            --region "$AWS_REGION"
          aws ecs wait services-stable --cluster hosp-staging --services hosp-staging-api --region "$AWS_REGION"
      - name: Smoke tests (staging)
        env:
          SMOKE_BASE_URL: ${{ secrets.STAGING_API_URL }}
        run: |
          curl -sf "$SMOKE_BASE_URL/health" | grep -q ok
          curl -sf "$SMOKE_BASE_URL/api/health" | grep -q ok
          curl -sf "$SMOKE_BASE_URL/api/openapi.yaml" | head -5

  deploy-production:
    runs-on: ubuntu-latest
    needs: [build-push, deploy-staging]
    environment: production # require manual approval in GitHub Environments
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Prisma migrate deploy (production)
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          npm ci --no-audit --no-fund
          npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma
      - name: Deploy to ECS production
        run: |
          aws ecs update-service \
            --cluster hosp-prod \
            --service hosp-prod-api \
            --force-new-deployment \
            --region "$AWS_REGION"
          aws ecs wait services-stable --cluster hosp-prod --services hosp-prod-api --region "$AWS_REGION"
      - name: Smoke tests (production)
        env:
          SMOKE_BASE_URL: ${{ secrets.PROD_API_URL }}
        run: |
          curl -sf "$SMOKE_BASE_URL/health" | grep -q ok
          curl -sf "$SMOKE_BASE_URL/api/health" | grep -q ok
