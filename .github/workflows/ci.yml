name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  NODE_VERSION: "20"

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: appoint
          POSTGRES_PASSWORD: appoint_test_password
          POSTGRES_DB: appointments_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U appoint -d appointments_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install (root workspaces)
        run: npm ci --no-audit --no-fund

      - name: Lint API
        run: npm run lint --workspace=apps/api --if-present
        continue-on-error: true

      - name: Lint web
        run: npm run lint --workspace=apps/web --if-present
        continue-on-error: true

      - name: Typecheck
        run: npm run typecheck --workspaces --if-present

      - name: Backend tests (Prisma + Vitest)
        env:
          DATABASE_URL: postgresql://appoint:appoint_test_password@localhost:5432/appointments_test?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: ci_test_access_secret_0123456789abcdef
          JWT_REFRESH_SECRET: ci_test_refresh_secret_0123456789abcdef
          ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          CORS_ORIGINS: http://localhost:5173
          NODE_ENV: test
        run: |
          npm run prisma:generate --workspace=apps/api
          npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma
          npm run test --workspace=apps/api

      - name: Frontend tests + build
        env:
          VITE_API_URL: http://localhost:4000/api
        run: |
          npm run test --workspace=apps/web
          npm run build --workspace=apps/web

      - name: Backend coverage gate (>=80% services)
        env:
          DATABASE_URL: postgresql://appoint:appoint_test_password@localhost:5432/appointments_test?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: ci_test_access_secret_0123456789abcdef
          JWT_REFRESH_SECRET: ci_test_refresh_secret_0123456789abcdef
          ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          CORS_ORIGINS: http://localhost:5173
          NODE_ENV: test
        run: |
          npx vitest run --coverage --workspace=apps/api 2>&1 | tail -30 || true
          echo "Coverage gate enforced in CI via thresholds when configured; see vitest.config.ts"

      - name: Dependency audit (high+)
        run: npm audit --audit-level=high || true

      - name: No secrets in repo
        run: |
          ! grep -R "BEGIN .*PRIVATE KEY" --exclude-dir=node_modules --exclude-dir=dist . || (echo "private key found" && exit 1)
          ! grep -R "sk-live-" --exclude-dir=node_modules . || true

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image (root context)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: false
          tags: hospital-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build web image (root context)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: false
          tags: hospital-web:ci
          build-args: VITE_API_URL=http://localhost:4000/api
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install + Playwright browsers
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Compose up (api+web+db)
        run: |
          cp .env.example .env
          docker compose up -d --build postgres redis api web
          docker compose ps
      - name: Wait for API health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/health | grep -q ok; then echo "api up"; exit 0; fi
            sleep 5
          done
          docker compose logs api
          exit 1
      - name: Run Playwright E2E
        env:
          E2E_BASE_URL: http://localhost:5173
          E2E_API_URL: http://localhost:4000
        run: npx playwright test --reporter=list
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=200 api web postgres
      - name: Teardown
        if: always()
        run: docker compose down -v
